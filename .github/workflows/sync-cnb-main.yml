name: Sync CNB Main

on:
  push:
    branches:
      - phaser
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-to-cnb:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync phaser to cnb/main
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          if [ -z "$CNB_TOKEN" ]; then
            echo "CNB_TOKEN is missing. Add it in GitHub repo secrets." >&2
            exit 1
          fi

          git remote add cnb "https://cnb:${CNB_TOKEN}@cnb.cool/Azem.Finn/Pixel_House"
          git fetch cnb main
          git push --force-with-lease cnb HEAD:main
